<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101d32"><title>ESSA — Dr. Essa Dental Clinic</title><link rel="icon" href="assets/img_app_icon_emblem.jpg"><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icon-192.png"></head><body><div id="app"></div><script src="data.js"></script><script src="app.js"></script><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});</script><div id="installBox" style="display:none;position:fixed;bottom:16px;left:16px;z-index:90;background:#10243b;color:white;padding:12px 16px;border:1px solid #c5a25d;border-radius:18px;box-shadow:0 10px 32px #0005;max-width:320px"><b>ESSA على هاتفك</b><p style="margin:4px 0 10px;font-size:12px">ثبّت أيقونة ESSA لفتح الموقع مباشرة</p><button id="installBtn" style="background:#c5a25d;border:0;border-radius:20px;padding:8px 18px">تثبيت التطبيق</button><button onclick="document.getElementById('installBox').style.display='none'" style="background:transparent;color:white;border:0;padding:8px">×</button></div><script>let deferredInstall;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;document.getElementById("installBox").style.display="block"});document.getElementById("installBtn").addEventListener("click",async()=>{if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;document.getElementById("installBox").style.display="none"}});</script></body></html>
